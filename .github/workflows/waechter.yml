# Ein-Facher Rechnungen – Wächter
# Prüft automatisch (auch wenn die App zu ist): Zahlungseingänge über die Bank,
# überfällige und bezahlte Rechnungen – und schickt dazu eine E-Mail.
# Einrichtung: README → "Automatische E-Mail-Benachrichtigungen".
name: Rechnungs-Wächter

on:
  schedule:
    # jede Viertelstunde: :00, :15, :30, :45 (GitHub startet geplante Läufe teils einige Minuten später).
    # Die Bank selbst wird nur ca. alle 3,5 Stunden tagsüber neu abgefragt (Limit der Banken),
    # Buchungen aus der App und Überfälligkeiten werden aber bei jedem Lauf gemeldet.
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:
    inputs:
      trocken:
        description: "Trockenlauf (nichts buchen, keine E-Mail)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: waechter
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Rechnungen prüfen und benachrichtigen
        env:
          EF_CLIENT_SECRET: ${{ secrets.EF_CLIENT_SECRET }}
          SB_EMAIL: ${{ secrets.SB_EMAIL }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
        run: node tools/waechter.mjs ${{ inputs.trocken && '--trocken' || '' }}
